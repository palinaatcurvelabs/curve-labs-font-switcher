<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Curve Labs</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/curve-labs-logo.png" />
  <link rel="apple-touch-icon" href="/curve-labs-logo.png" />

  <!-- SEO Meta Tags -->
  <meta name="description" content="Curve Labs is a venture laboratory building digital souls through relational technologies. We explore the intersection of cybernetics, AI, and decentralized systems." />
  <meta name="keywords" content="Curve Labs, relational technologies, digital souls, cybernetics, venture laboratory" />
  <meta name="author" content="Curve Labs" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Curve Labs | Venture Laboratory for Relational Technologies" />
  <meta property="og:description" content="Curve Labs is a venture laboratory building digital souls through relational technologies." />
  <meta property="og:image" content="/curve-labs-logo.png" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Curve Labs | Venture Laboratory for Relational Technologies" />
  <meta name="twitter:description" content="Curve Labs is a venture laboratory building digital souls through relational technologies." />
  <meta name="twitter:image" content="/curve-labs-logo.png" />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <script>
    // Ensure the page always starts at the very top on first open / refresh.
    // (Some browsers restore scroll after JS loads unless we disable it early.)
    try {
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
      // If the URL includes a hash (e.g. `/#about`), don't "resume" there on open/refresh.
      // Always start at the Hero/top. Navbar clicks will re-add hashes normally.
      if (window.location.hash) {
        history.replaceState(null, '', window.location.pathname + window.location.search);
      }

      window.scrollTo(0, 0);
      window.addEventListener('pageshow', (e) => {
        // Handle back/forward cache restores (Safari/iOS).
        if (e.persisted) window.scrollTo(0, 0);
      });
    } catch { }
  </script>
  <style>
    /* CSS Variables for dynamic font switching */
    :root {
      --font-main: 'Darker Grotesque';
    }

    /* Darker Grotesque - Variable font */
    @font-face {
      font-family: 'Darker Grotesque';
      src: url('/fonts/DarkerGrotesque-VariableFont_wght.ttf') format('truetype');
      font-weight: 300 900;
      font-style: normal;
      font-display: swap;
    }

    /* Cardo - Serif option */
    @font-face {
      font-family: 'Cardo';
      src: url('/fonts/Cardo-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Cardo';
      src: url('/fonts/Cardo-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    /* EB Garamond - Serif option */
    @font-face {
      font-family: 'EB Garamond';
      src: url('/fonts/EBGaramond-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'EB Garamond';
      src: url('/fonts/EBGaramond-Medium.ttf') format('truetype');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'EB Garamond';
      src: url('/fonts/EBGaramond-SemiBold.ttf') format('truetype');
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'EB Garamond';
      src: url('/fonts/EBGaramond-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    /* Florderuina Ruina font - ornate gothic blackletter with dotted style */
    @font-face {
      font-family: 'Florderuina';
      src: url('/fonts/FlorDeRuina-Ruina.woff2') format('woff2'),
        url('/fonts/FlorDeRuina-Ruina.woff') format('woff');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    /* Custom Fonts */
    @font-face {
      font-family: 'FT88-Gothique';
      src: url('/fonts/FT88-Gothique.woff') format('woff');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'N27-Light';
      src: url('/fonts/N27-Light.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Format_1452';
      src: url('/fonts/Format_1452.woff') format('woff');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Stitch Warrior';
      src: url('/fonts/StitchWarrior demo.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }


    /* Custom scrollbar to match the technical aesthetic */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #09090b;
    }

    ::-webkit-scrollbar-thumb {
      background: #27272a;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #3f3f46;
    }

    @keyframes lamp-pulse {
      0% {
        opacity: 1;
        filter: blur(0px);
        color: #a1a1aa;
      }

      25% {
        opacity: 0.8;
        filter: blur(1px);
        color: rgba(161, 161, 170, 0.8);
      }


      50% {
        opacity: 0.3;
        filter: blur(5px);
        color: rgba(161, 161, 170, 0.3);
      }

      80% {
        opacity: 0.8;
        filter: blur(1px);
        color: rgba(161, 161, 170, 0.8);
      }


      100% {
        opacity: 1;
        filter: blur(0px);
        color: #a1a1aa;
      }
    }

    .animate-lamp {
      animation: lamp-pulse 5s ease-in-out infinite;
    }

    /* Mobile font size adjustments */
    @media (max-width: 768px) {

      body,
      p:not(.font-stitch-warrior),
      .font-body-text {
        font-size: 16px !important;
      }
    }
  </style>
</head>

<body class="bg-background text-zinc-100 antialiased selection:bg-zinc-700 selection:text-white">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
